name: Update VPN files

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: update-vpn-files
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build files
        run: python3 scripts/update_vpn.py

      - name: Debug
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f

      - name: Commit changes
        run: |
          if git diff --quiet -- all-vpn.txt all-vpn-base64.txt; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all-vpn.txt all-vpn-base64.txt
          git commit -m "Update VPN files [skip ci]"
          git push
